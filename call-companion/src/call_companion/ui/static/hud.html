<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Компаньон</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237aa2ff'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230e1015'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0e1015; --panel: #161a22; --panel-2: #1c212b; --line: #272d3a;
  --text: #e9ecf3; --muted: #8f98ad; --accent: #7aa2ff;
  --answer: #4cc38f; --fact: #5eb4ff; --reminder: #c996f0; --ask: #8aa7ff; --warn: #f1706f; --caution: #f0b64d;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --panel-2: #eef0f5; --line: #dde1ea;
    --text: #151922; --muted: #5d667b; --accent: #2f5fd7;
    --answer: #14804f; --fact: #1769b8; --reminder: #7b3fb3; --ask: #3a58c4; --warn: #c23232; --caution: #9a6a00;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 5;
}
.status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; min-height: 32px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.status[data-state="listening"] .dot { background: var(--answer); }
.status[data-state="thinking"] .dot { background: var(--caution); animation: pulse 1s ease-in-out infinite; }
.status[data-state="offline"] .dot { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
.title { color: var(--muted); flex: 1 1 140px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.btn, select {
  min-height: 40px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text);
}
.btn:hover { background: var(--panel-2); }
.btn[aria-pressed="true"] { border-color: var(--caution); color: var(--caution); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.danger { border-color: var(--warn); color: var(--warn); }
.btn[disabled] { opacity: .5; cursor: default; }

main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
section { min-width: 0; }
h2 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stack { display: grid; gap: 12px; align-content: start; }

.empty { color: var(--muted); padding: 28px 16px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.whisper {
  background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--kind, var(--accent));
  border-radius: var(--radius); padding: 14px 16px; transition: opacity .6s;
}
.whisper:first-child { padding: 18px 20px; }
.whisper:first-child .text { font-size: clamp(1.3rem, 1.2rem + 1.6vw, 2rem); line-height: 1.3; }
.whisper.old { opacity: .55; }
.whisper.live .text::after { content: "▍"; margin-left: 2px; color: var(--kind); animation: pulse 1s steps(2) infinite; }
.kind { font-size: .72rem; font-weight: 800; letter-spacing: .1em; color: var(--kind); margin-bottom: 4px; }
.text { font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: .78rem; color: var(--muted); background: var(--panel-2); border-radius: 999px; padding: 3px 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-answer { --kind: var(--answer); } .k-fact { --kind: var(--fact); } .k-reminder { --kind: var(--reminder); }
.k-ask { --kind: var(--ask); } .k-warn { --kind: var(--warn); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
details.card summary { cursor: pointer; font-weight: 600; }
.lines { max-height: 38vh; overflow: auto; margin-top: 8px; display: grid; gap: 6px; }
.line { overflow-wrap: anywhere; }
.who { font-weight: 700; margin-right: 6px; color: var(--accent); }
.line.me .who { color: var(--answer); }
ul { margin: 6px 0 0; padding-left: 20px; } li { margin: 3px 0; }
.meta { color: var(--muted); font-size: .85rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.approval .state { margin-top: 6px; font-size: .85rem; color: var(--muted); }
.approval[data-status="executed"] { border-color: var(--answer); }
.approval[data-status="failed"], .approval[data-status="rejected"], .approval[data-status="expired"] { border-color: var(--warn); }
pre.draft { white-space: pre-wrap; font: inherit; margin: 8px 0 0; padding: 10px; background: var(--panel-2); border-radius: 10px; }

form.ask { display: flex; gap: 8px; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--bg); }
form.ask input { flex: 1; min-width: 0; min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); max-width: min(92vw, 520px); padding: 10px 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); display: none; z-index: 10; }
#toast.show { display: block; }

@media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px; } .controls { margin-left: 0; } }
body.compact main { grid-template-columns: 1fr; padding: 8px; gap: 8px; }
body.compact #side, body.compact .title, body.compact h2 { display: none; }
body.compact header { padding: 6px 10px; gap: 6px; }
body.compact #end { display: none; }
body.compact .btn, body.compact select { min-height: 34px; padding: 3px 10px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="status" id="status" data-state="offline" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text">Подключаюсь…</span></div>
  <div class="title" id="title"></div>
  <div class="controls">
    <label class="sr" for="mode">Режим разговора</label>
    <select id="mode" title="Режим определяет, какие данные можно показывать">
      <option value="internal">Свои</option>
      <option value="client">Клиент</option>
      <option value="interview">Собеседование</option>
      <option value="public">Публичный</option>
    </select>
    <button class="btn" id="mute" type="button" aria-pressed="false" title="Не показывать подсказки сами (клавиша M)">Тихо</button>
    <button class="btn danger" id="panic" type="button" title="Очистить экран и замолчать (клавиша Esc)">Скрыть</button>
    <button class="btn" id="end" type="button">Закончить</button>
  </div>
</header>

<main>
  <div class="stack">
    <section aria-labelledby="h-whispers">
      <h2 id="h-whispers">Подсказки</h2>
      <div class="stack" id="whispers" aria-live="polite" aria-relevant="additions text">
        <div class="empty" id="empty">Пока тихо. Подсказка появится, когда будет что сказать.</div>
      </div>
    </section>
    <section id="approvals-wrap" hidden aria-labelledby="h-approvals">
      <h2 id="h-approvals">Нужно ваше решение</h2>
      <div class="stack" id="approvals"></div>
      <div class="row"><button class="btn primary" id="approve-all" type="button" hidden>Разрешить все</button></div>
    </section>
    <section id="summary-wrap" hidden aria-labelledby="h-summary">
      <h2 id="h-summary">Итоги</h2>
      <div class="card" id="summary"></div>
    </section>
  </div>

  <div class="stack" id="side">
    <details class="card" id="brief-card">
      <summary id="brief-summary">Перед звонком</summary>
      <div id="brief"></div>
    </details>
    <section aria-labelledby="h-actions">
      <h2 id="h-actions">Обещания</h2>
      <div class="card"><ul id="actions"><li class="meta" id="actions-empty">Пока ничего не прозвучало.</li></ul></div>
    </section>
    <details class="card" open>
      <summary>Расшифровка</summary>
      <div class="lines" id="lines"></div>
    </details>
  </div>
</main>

<form class="ask" id="ask" autocomplete="off">
  <label class="sr" for="ask-text">Вопрос компаньону</label>
  <input id="ask-text" type="text" maxlength="500" placeholder="Спросить компаньона… (клавиша /)">
  <button class="btn primary" type="submit">Спросить</button>
  <button class="btn" id="ask-last" type="button" title="Подсказка по последней реплике собеседника">?</button>
</form>
<div id="toast" role="alert"></div>

<script>
(() => {
  'use strict';
  const $ = (selector) => document.querySelector(selector);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };
  const KINDS = { answer: 'ОТВЕТ', fact: 'ФАКТ', reminder: 'НАПОМИНАНИЕ', ask: 'СПРОСИТЬ', warn: 'ВНИМАНИЕ' };
  const STATES = { listening: 'Слушаю', thinking: 'Ищу в kernel…', ended: 'Звонок завершён', offline: 'Нет связи' };
  const OLD_AFTER_MS = 45000;
  const MAX_WHISPERS = 6;
  const MAX_LINES = 60;
  const state = { muted: false, lines: new Set(), actions: new Set() };

  if (new URLSearchParams(location.search).get('compact')) document.body.classList.add('compact');

  const toast = (message) => {
    const box = $('#toast');
    box.textContent = message;
    box.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => box.classList.remove('show'), 5000);
  };

  async function api(path, body) {
    const response = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Companion': '1' },
      body: JSON.stringify(body ?? {}),
    });
    if (!response.ok) {
      toast('Не получилось: ' + response.status);
      throw new Error(String(response.status));
    }
    return response.json();
  }

  function setStatus(data) {
    const key = data.state || 'listening';
    $('#status').dataset.state = key;
    $('#status-text').textContent = STATES[key] || key;
    if (data.mode) $('#mode').value = data.mode;
    if (typeof data.muted === 'boolean') {
      state.muted = data.muted;
      const button = $('#mute');
      button.setAttribute('aria-pressed', String(data.muted));
      button.textContent = data.muted ? 'Тихо: вкл' : 'Тихо';
    }
    if (data.latency_ms) $('#status').title = 'Последняя подсказка: ' + data.latency_ms + ' мс';
  }

  function whisperCard(id) {
    let card = document.querySelector('[data-whisper="' + CSS.escape(id) + '"]');
    if (!card) {
      card = el('article', 'whisper');
      card.dataset.whisper = id;
      card.append(el('div', 'kind'), el('div', 'text'), el('div', 'chips'));
      $('#whispers').prepend(card);
      $('#empty').hidden = true;
      [...document.querySelectorAll('.whisper')].slice(MAX_WHISPERS).forEach((old) => old.remove());
    }
    return card;
  }

  function renderWhisper(data) {
    const card = whisperCard(data.id);
    card.className = 'whisper k-' + data.kind + (data.final ? '' : ' live');
    card.dataset.at = String(Date.now());
    card.classList.remove('old');
    card.querySelector('.kind').textContent = KINDS[data.kind] || data.kind;
    card.querySelector('.text').textContent = data.text;
    const chips = card.querySelector('.chips');
    chips.replaceChildren();
    for (const source of data.sources || []) {
      const date = source.ts ? new Date(source.ts).toLocaleDateString('ru-RU') : '';
      const label = [source.source, source.title || source.id, date].filter(Boolean).join(' · ');
      const chip = el('span', 'chip', label);
      chip.title = label;
      chips.append(chip);
    }
  }

  function renderLine(data) {
    if (!data.text || state.lines.has(data.id)) return;
    state.lines.add(data.id);
    const line = el('div', 'line ' + data.channel);
    line.append(el('span', 'who', data.channel === 'me' ? 'Я' : data.speaker), document.createTextNode(data.text));
    const box = $('#lines');
    box.append(line);
    while (box.children.length > MAX_LINES) box.firstChild.remove();
    box.scrollTop = box.scrollHeight;
  }

  function renderAction(data) {
    if (state.actions.has(data.id)) return;
    state.actions.add(data.id);
    $('#actions-empty').hidden = true;
    const item = el('li', null, data.text);
    const meta = [data.owner && 'кто: ' + data.owner, data.due && 'срок: ' + data.due].filter(Boolean).join(' · ');
    if (meta) item.append(el('div', 'meta', meta));
    $('#actions').append(item);
  }

  function renderBrief(data) {
    $('#title').textContent = data.title || '';
    $('#brief-summary').textContent = 'Перед звонком · материалов: ' + data.items;
    const box = $('#brief');
    box.replaceChildren();
    const block = (heading, rows) => {
      if (!rows || !rows.length) return;
      box.append(el('div', 'meta', heading));
      const list = el('ul');
      rows.forEach((row) => list.append(el('li', null, row)));
      box.append(list);
    };
    block('Участники', data.attendees);
    block('Ваши хвосты', data.open_loops);
    block('Тезисы', data.talking_points);
    if (data.mode) $('#mode').value = data.mode;
  }

  const LABELS = { 'kernel.note': 'Запись в kernel', 'kernel.task': 'Задача в kernel', 'email.draft': 'Черновик', 'email.send': 'Отправка письма' };
  const STATUS_TEXT = { pending: 'ждёт решения', approved: 'одобрено', executed: 'выполнено', rejected: 'отклонено', expired: 'просрочено', failed: 'не удалось' };

  function renderApproval(ticket) {
    const wrap = $('#approvals');
    let card = document.querySelector('[data-ticket="' + CSS.escape(ticket.id) + '"]');
    if (!card) {
      card = el('article', 'card approval');
      card.dataset.ticket = ticket.id;
      wrap.append(card);
    }
    card.dataset.status = ticket.status;
    card.replaceChildren(
      el('div', 'meta', LABELS[ticket.action.capability] || ticket.action.capability),
      el('div', null, ticket.action.title),
    );
    if (ticket.status === 'pending') {
      const row = el('div', 'row');
      const yes = el('button', 'btn primary', 'Разрешить');
      const no = el('button', 'btn', 'Отклонить');
      yes.type = no.type = 'button';
      yes.onclick = () => api('/api/approvals/' + ticket.id, { approve: true });
      no.onclick = () => api('/api/approvals/' + ticket.id, { approve: false });
      row.append(yes, no);
      card.append(row);
    } else {
      card.append(el('div', 'state', STATUS_TEXT[ticket.status] + (ticket.result ? ' · ' + ticket.result : '')));
    }
    refreshApprovals();
  }

  function refreshApprovals() {
    const cards = [...document.querySelectorAll('.approval')];
    const pending = cards.filter((card) => card.dataset.status === 'pending');
    $('#approvals-wrap').hidden = cards.length === 0;
    $('#approve-all').hidden = pending.length < 2;
  }

  function renderSummary(data) {
    const summary = data.summary;
    if (!summary) return;
    const box = $('#summary');
    box.replaceChildren(el('div', 'text', summary.title || 'Итоги'), el('p', null, summary.tldr));
    const list = (heading, rows) => {
      if (!rows || !rows.length) return;
      box.append(el('div', 'meta', heading));
      const ul = el('ul');
      rows.forEach((row) => ul.append(el('li', null, row)));
      box.append(ul);
    };
    list('Решения', summary.decisions);
    list('Открытые вопросы', summary.open_questions);
    if (summary.followup_draft) {
      box.append(el('div', 'meta', 'Черновик follow-up (не отправляется)'), el('pre', 'draft', summary.followup_draft));
      const copy = el('button', 'btn', 'Скопировать');
      copy.type = 'button';
      copy.onclick = () => navigator.clipboard.writeText(summary.followup_draft).then(() => toast('Скопировано'));
      box.append(copy);
    }
    $('#summary-wrap').hidden = false;
  }

  const handlers = {
    status: setStatus,
    brief: renderBrief,
    utterance: renderLine,
    suggestion: renderWhisper,
    suggestion_cancel: (data) => document.querySelector('[data-whisper="' + CSS.escape(data.id) + '"]')?.remove(),
    action_candidate: renderAction,
    approval: renderApproval,
    summary: renderSummary,
    clear: () => { document.querySelectorAll('.whisper').forEach((node) => node.remove()); $('#empty').hidden = false; },
    warning: (data) => toast(data.message),
    error: (data) => toast('Ошибка: ' + data.message),
  };

  function connect(after) {
    const source = new EventSource('/events?after=' + after);
    source.onopen = () => { if ($('#status').dataset.state === 'offline') setStatus({ state: 'listening' }); };
    source.onerror = () => setStatus({ state: 'offline' });
    for (const [type, handler] of Object.entries(handlers)) {
      // EventSource fires its own data-less "error" event on a dropped connection; ours always carries data.
      source.addEventListener(type, (event) => {
        if (typeof event.data === 'string') handler(JSON.parse(event.data));
      });
    }
  }

  async function start() {
    const response = await fetch('/api/state');
    if (!response.ok) { setStatus({ state: 'offline' }); toast('Нужна ссылка с токеном: откройте адрес из терминала'); return; }
    const snapshot = await response.json();
    $('#title').textContent = snapshot.title;
    setStatus({ state: snapshot.state, mode: snapshot.mode, muted: snapshot.muted });
    snapshot.transcript.forEach(renderLine);
    snapshot.actions.forEach(renderAction);
    snapshot.suggestions.forEach((item) => renderWhisper({ ...item, final: true }));
    snapshot.approvals.forEach(renderApproval);
    if (snapshot.summary) renderSummary({ summary: snapshot.summary });
    connect(snapshot.last_event_id);
  }

  $('#mode').onchange = (event) => api('/api/mode', { mode: event.target.value });
  $('#mute').onclick = () => api('/api/mute', { muted: !state.muted });
  $('#panic').onclick = () => api('/api/panic');
  $('#end').onclick = () => { if (confirm('Завершить звонок и подготовить итоги?')) api('/api/end'); };
  $('#ask-last').onclick = () => api('/api/ask', { text: '' });
  $('#approve-all').onclick = async () => {
    for (const card of document.querySelectorAll('.approval[data-status="pending"]')) {
      await api('/api/approvals/' + card.dataset.ticket, { approve: true });
    }
  };
  $('#ask').onsubmit = (event) => {
    event.preventDefault();
    const input = $('#ask-text');
    api('/api/ask', { text: input.value.trim() });
    input.value = '';
  };
  document.addEventListener('keydown', (event) => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (event.key === 'Escape') api('/api/panic');
    else if (!typing && event.key === '/') { event.preventDefault(); $('#ask-text').focus(); }
    else if (!typing && event.key.toLowerCase() === 'm') api('/api/mute', { muted: !state.muted });
  });
  setInterval(() => {
    const now = Date.now();
    document.querySelectorAll('.whisper:not(.live)').forEach((card) => {
      if (now - Number(card.dataset.at || now) > OLD_AFTER_MS) card.classList.add('old');
    });
  }, 5000);

  start();
})();
</script>
</body>
</html>
